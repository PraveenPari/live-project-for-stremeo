name: Daily Stream Check

on:
  schedule:
    # 8:00 AM IST = 02:30 UTC
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      check_only:
        description: 'Run preflight checks only — do not start streaming'
        required: false
        default: false
        type: boolean
      wait_minutes:
        description: 'If not live yet, keep polling this many minutes'
        required: false
        default: '30'
        type: string
      youtube_url:
        description: 'Override the YouTube URL (defaults to the secret/config)'
        required: false
        default: ''
        type: string

jobs:
  check-and-stream:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Set up Node.js (required by yt-dlp)
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg
        python -m pip install --upgrade pip
        pip install --upgrade yt-dlp bgutil-ytdlp-pot-provider
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        echo "yt-dlp version:" && yt-dlp --version
        echo "node version:" && node --version

    - name: Start PO Token provider (YouTube bot-check bypass)
      run: |
        docker run -d --name pot -p 4416:4416 brainicism/bgutil-ytdlp-pot-provider
        for i in $(seq 1 15); do curl -sf http://localhost:4416/ping && break || sleep 2; done
        echo

    - name: Setup Cookies
      env:
        COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_BASE64 }}
        COOKIES_RAW: ${{ secrets.YOUTUBE_COOKIES }}
      run: |
        if [ -n "$COOKIES_B64" ]; then
          echo "$COOKIES_B64" | base64 -d > cookies.txt
          echo "cookies.txt from BASE64 ($(wc -l < cookies.txt) lines, $(wc -c < cookies.txt) bytes)"
        elif [ -n "$COOKIES_RAW" ]; then
          echo "$COOKIES_RAW" > cookies.txt
          echo "cookies.txt from RAW ($(wc -l < cookies.txt) lines, $(wc -c < cookies.txt) bytes)"
        else
          echo "WARNING: No cookies secret set!"
        fi

    - name: Run Auto Streamer
      env:
        YOUTUBE_URL: ${{ secrets.YOUTUBE_URL }}
        YOUTUBE_CHANNEL_URL: ${{ secrets.YOUTUBE_CHANNEL_URL }}
        FB_STREAM_KEY: ${{ secrets.FB_STREAM_KEY }}
        CHECK_ONLY: ${{ inputs.check_only || false }}
        WAIT_MINUTES: ${{ inputs.wait_minutes || '30' }}
        YT_OVERRIDE: ${{ inputs.youtube_url }}
      run: |
        ARGS="--wait-for-live $WAIT_MINUTES"
        if [ "$CHECK_ONLY" = "true" ]; then
          ARGS="$ARGS --check-only"
        fi
        if [ -n "$YT_OVERRIDE" ]; then
          ARGS="$ARGS --url $YT_OVERRIDE"
        fi
        python autostream.py $ARGS
