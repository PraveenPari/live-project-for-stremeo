<!doctype html>
<html><head><meta charset="utf-8"><style>
*{margin:0;padding:0}html,body{width:1080px;height:1080px;overflow:hidden;background:#08090d}
</style></head><body>
<div id="stage" class="clip" data-composition-id="main" data-start="0" data-duration="3" data-width="1080" data-height="1080"></div>
<script src="p5.min.js"></script>
<script>
new p5((p) => {
  p.setup = () => { p.createCanvas(1080,1080).parent('stage'); p.noLoop(); };
  p.draw = () => {};
  window.__renderAt = (t) => {
    p.noLoop();
    p.background('#08090d');
    p.noFill();
    for (let i=0;i<26;i++){
      p.stroke(255, 255-(i*6), 120+i*4, 200-(i*5));
      p.strokeWeight(2);
      p.beginShape();
      for (let x=0;x<=1080;x+=18){
        const y = 540 + Math.sin((x*0.006) + t*2.2 + i*0.22) * (90+i*7) * Math.cos(t*0.7+i*0.1);
        p.vertex(x,y);
      }
      p.endShape();
    }
    p.fill(255); p.noStroke(); p.textAlign(p.CENTER);
    p.textSize(64); p.text('p5 generative', 540, 150);
  };
  setTimeout(() => {
    window.__renderAt(0);
    window.addEventListener('hf-seek', e => window.__renderAt(e.detail.time));
  }, 60);
});
</script></body></html>
