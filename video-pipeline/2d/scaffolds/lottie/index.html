<!doctype html>
<html><head><meta charset="utf-8"><style>
*{margin:0;padding:0}html,body{width:1200px;height:1200px;overflow:hidden;background:#0e0f13}
#stage{width:1200px;height:1200px;display:grid;place-items:center}
</style></head><body>
<div id="stage" class="clip" data-composition-id="main" data-start="0" data-duration="3" data-width="1200" data-height="1200">
  <div id="anim" style="width:690px;height:913px"></div>
</div>
<script src="gsap.min.js"></script><script src="lottie.min.js"></script>
<script>
const a = lottie.loadAnimation({container: document.getElementById('anim'), renderer:'svg', loop:false, autoplay:false, path:'anim.json'});
window.__hfLottie = window.__hfLottie || [];
window.__hfLottie.push(a);
const tl = gsap ?? null;
// register timeline; seek lottie from it
const proxy={t:0};
const tlm = window.gsap ? gsap.timeline({paused:true}) : null;
if (tlm){ tlm.to(proxy,{t:3,duration:3,ease:'none',onUpdate:()=>{ a.goToAndStop(proxy.t*30, true); }}); window.__timelines={main:tlm}; }
a.addEventListener('DOMLoaded',()=>{ a.goToAndStop(0,true); });
</script>
</body></html>
