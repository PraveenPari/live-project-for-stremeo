<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>{{TITLE}}</title>
    <link rel="stylesheet" href="fonts.css" />
    <script src="gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: {{WIDTH}}px;
        height: {{HEIGHT}}px;
        overflow: hidden;
        background: #000;
      }
      #stage {
        position: relative;
        width: {{WIDTH}}px;
        height: {{HEIGHT}}px;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div
      id="stage"
      class="clip"
      data-composition-id="main"
      data-start="0"
      data-duration="{{DURATION}}"
      data-width="{{WIDTH}}"
      data-height="{{HEIGHT}}"
    ></div>

    <script type="application/json" id="anim-config">
{{CONFIG_JSON}}
    </script>
    <script src="anim.js"></script>
  </body>
</html>
